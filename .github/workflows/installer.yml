name: Installer preflight
on: [push, pull_request]
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install.sh scripts/install-dependencies.sh
      - run: python3 -m unittest discover -s tests -p 'test_install_dependencies.py' -v
