version: '3'
vars:
  SUBMODULES:
    sh: git submodule foreach --quiet 'printf "%s " "$name"'
tasks:
  icons:build:
    desc: Build both icon variants and the template bundle
    dir: holonight-icons
    cmds:
    - task build
  icons:validate:
    desc: Build and validate canonical icons and both generated themes
    dir: holonight-icons
    cmds:
    - task validate
  icons:test:
    desc: Run icons regression and packaging tests
    dir: holonight-icons
    cmds:
    - task test
  icons:verify:
    desc: Verify icons against the umbrella Qt renderer, with previews and licensing
    cmds:
    - task -d holonight-icons check -- --siblings '{{.ROOT_DIR}}'
    - python3 '{{.ROOT_DIR}}/tests/check_staged_icons.py'
  icons:preview:
    desc: Generate icon family previews using the umbrella Qt renderer
    dir: holonight-icons
    cmds:
    - env HOLONIGHT_QT_SOURCE='{{.ROOT_DIR}}/holonight-qt' task preview:icons
  license-check:
    desc: Validate REUSE metadata in the umbrella and initialized submodules
    cmds:
    - reuse lint
    - for:
        var: SUBMODULES
      task: license-check:repository
      vars:
        REPOSITORY: '{{.ITEM}}'
  license-check:repository:
    internal: true
    dir: '{{.REPOSITORY}}'
    cmds:
    - reuse lint
  test:installer:
    desc: Check dependencies and icon/application installation in disposable roots
    cmds:
    - python3 -m unittest discover -s tests -p 'test_install*.py' -v
  install:
    desc: Build and install the pinned HoloNight ecosystem from source
    cmds:
    - scripts/install.sh {{.CLI_ARGS}}
  uninstall:
    desc: Remove an umbrella-managed source installation
    cmds:
    - scripts/uninstall.sh {{.CLI_ARGS}}
  build:
    desc: Build current sibling checkouts into a native integration prefix
    cmds:
    - python3 scripts/build-ecosystem.py {{.CLI_ARGS}}
  test:
    desc: Build and test current siblings against a native integration prefix
    cmds:
    - python3 scripts/build-ecosystem.py --tests {{.CLI_ARGS}}
  check:
    desc: Installer and licensing acceptance in the shared image
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  check:integration:
    desc: Build and test umbrella gitlinks together in the shared image
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  format:
    desc: Format component sources with the pinned container formatter
    cmds:
    - for:
        var: SUBMODULES
      cmd: task -d {{.ITEM}} format
